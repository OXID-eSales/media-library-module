imports:
  - { resource: 'Svg/services.yaml' }

services:
  _defaults:
    public: false
    autowire: true

  OxidEsales\MediaLibrary\Validation\Validator\ContentValidator\Dispatcher:
    arguments:
      $contentValidators: !tagged_iterator oxid_esales.media_library.validation.content_validator
    tags: ['oxid_esales.media_library.validation.chain_validator']

  OxidEsales\MediaLibrary\Validation\Validator\ContentValidator\Svg\SvgContentValidator:
    tags: ['oxid_esales.media_library.validation.content_validator']

  OxidEsales\MediaLibrary\Validation\Validator\ContentValidator\RasterImageContentValidator:
    tags: ['oxid_esales.media_library.validation.content_validator']
